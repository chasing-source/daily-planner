  <style>
    :root {
      --bg: #f7f8fc;
      --surface: rgba(255, 255, 255, .94);
      --surface-solid: #ffffff;
      --text: #172033;
      --muted: #6c768c;
      --soft: #eef1f7;
      --line: #e4e8f0;
      --accent: #4f6ef7;
      --accent-deep: #3654d8;
      --accent-soft: #edf1ff;
      --success: #2ba672;
      --success-soft: #e9f8f1;
      --danger: #d85663;
      --danger-soft: #fff0f2;
      --shadow: 0 18px 55px rgba(37, 50, 86, .09);
      --shadow-soft: 0 8px 24px rgba(37, 50, 86, .06);
      --radius-lg: 24px;
      --radius-md: 17px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(116, 139, 255, .16), transparent 28rem),
        radial-gradient(circle at 94% 12%, rgba(92, 204, 166, .12), transparent 25rem),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button, input[type="checkbox"] { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 28px 30px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(247,249,255,.92));
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -105px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(79,110,247,.15), rgba(43,166,114,.08));
      pointer-events: none;
    }

    .clock-panel { position: relative; z-index: 1; min-width: 0; }
    .timezone-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(43,166,114,.11);
      animation: pulse 2.2s ease-in-out infinite;
    }
    .clock {
      display: block;
      font-size: clamp(38px, 6vw, 62px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
    }
    .hero-date {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 99px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 750;
      transition: color .16s ease, background .16s ease;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aab3c6;
    }
    .sync-badge[data-status="connecting"] .sync-dot,
    .sync-badge[data-status="saving"] .sync-dot {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .sync-badge[data-status="synced"] { color: #347b60; background: var(--success-soft); }
    .sync-badge[data-status="synced"] .sync-dot { background: var(--success); }
    .sync-badge[data-status="offline"] { color: #a25d16; background: #fff6e7; }
    .sync-badge[data-status="offline"] .sync-dot { background: #dc8a2e; }
    .sync-button { white-space: nowrap; }
    .date-nav {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
      max-width: 500px;
    }
    .icon-button,
    .secondary-button,
    .primary-button,
    .action-button,
    .move-button {
      border: 0;
      border-radius: 11px;
      transition: transform .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .icon-button:active, .secondary-button:active, .primary-button:active,
    .action-button:active, .move-button:active { transform: scale(.96); }
    .icon-button:focus-visible, .secondary-button:focus-visible, .primary-button:focus-visible,
    .action-button:focus-visible, .move-button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(79,110,247,.22);
      outline-offset: 2px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 25px;
      line-height: 1;
    }
    .icon-button:hover { background: #e4e9f5; }

    .date-input {
      min-height: 42px;
      padding: 0 12px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-solid);
      outline: none;
      font-size: 14px;
      font-weight: 600;
    }
    .secondary-button {
      min-height: 42px;
      padding: 0 15px;
      color: var(--accent-deep);
      background: var(--accent-soft);
      font-size: 14px;
      font-weight: 700;
    }
    .secondary-button:hover { background: #e2e8ff; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      padding: 17px 18px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .stat-value {
      display: block;
      font-size: 27px;
      line-height: 1.1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .stat-card.done .stat-value { color: var(--success); }
    .stat-card.pending .stat-value { color: var(--accent); }

    .progress-card {
      padding: 18px 20px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .progress-head strong { color: var(--text); font-size: 15px; }
    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--soft);
    }
    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #65a6f3 60%, var(--success));
      transition: width .35s ease;
    }
    .card {
      border: 1px solid rgba(255,255,255,.9);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .composer {
      padding: 23px 24px;
      margin-bottom: 18px;
    }
    .section-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 17px;
    }
    .section-kicker {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
    }
    h1, h2, p { margin-top: 0; }
    .section-heading h2 {
      margin-bottom: 0;
      font-size: 21px;
      letter-spacing: -.02em;
    }
    .selected-date-label {
      flex: none;
      padding: 6px 10px;
      color: var(--muted);
      border-radius: 99px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 700;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 140px auto;
      align-items: end;
      gap: 11px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .field > span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-solid);
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .field input::placeholder { color: #a2abc0; }
    .field input:focus { border-color: rgba(79,110,247,.72); box-shadow: 0 0 0 4px rgba(79,110,247,.09); }

    .primary-button {
      min-height: 46px;
      padding: 0 19px;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 9px 20px rgba(79,110,247,.22);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .primary-button:hover { background: var(--accent-deep); transform: translateY(-1px); }

    .form-error {
      margin: 12px 0 0;
      padding: 9px 12px;
      color: var(--danger);
      border-radius: 10px;
      background: var(--danger-soft);
      font-size: 13px;
      font-weight: 650;
    }
    .shake { animation: shake .32s ease; }

    .lists-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 18px;
    }
    .list-card { padding: 21px; min-width: 0; }
    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .list-title-wrap { display: flex; align-items: center; gap: 9px; }
    .list-head h2 { margin: 0; font-size: 18px; }
    .list-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }
    .done-card .list-dot { background: var(--success); box-shadow: 0 0 0 5px var(--success-soft); }
    .count-badge {
      min-width: 28px;
      padding: 4px 8px;
      text-align: center;
      border-radius: 99px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .list-hint {
      margin-bottom: 15px;
      color: #98a1b5;
      font-size: 12px;
    }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      position: relative;
      display: grid;
      grid-template-columns: 20px 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 13px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-solid);
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease, opacity .16s ease, background .16s ease;
    }
    .task-item:hover {
      border-color: #d4daea;
      box-shadow: 0 8px 20px rgba(37,50,86,.055);
    }
    .task-item.is-done {
      border-color: #dceee6;
      background: #fbfefc;
    }
    .task-item.is-dragging { opacity: .38; transform: scale(.985); }
    .task-item.is-drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.1); }

    .drag-handle {
      color: #aeb6c8;
      user-select: none;
      font-size: 18px;
      line-height: 1;
      text-align: center;
      cursor: grab;
    }
    .drag-handle:active { cursor: grabbing; }

    .task-check {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 2px solid #cbd2e0;
      border-radius: 7px;
      background: #fff;
      display: grid;
      place-items: center;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .task-check:hover { border-color: var(--success); transform: scale(1.04); }
    .task-check:checked { border-color: var(--success); background: var(--success); }
    .task-check:checked::after {
      content: "";
      width: 6px;
      height: 10px;
      margin-top: -2px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .task-copy { min-width: 0; }
    .task-text {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 650;
    }
    .is-done .task-text {
      color: #879187;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }
    .task-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    .time-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 7px;
      background: var(--soft);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .is-done .time-pill { background: var(--success-soft); color: #438368; }

    .task-actions { display: flex; align-items: center; gap: 3px; }
    .action-button, .move-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      font-size: 15px;
    }
    .action-button:hover, .move-button:hover { color: var(--text); background: var(--soft); }
    .action-button.delete:hover { color: var(--danger); background: var(--danger-soft); }
    .move-button { display: none; }

    .edit-form {
      grid-column: 3 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px 112px;
      gap: 8px;
      min-width: 0;
    }
    .edit-form input {
      width: 100%;
      min-width: 0;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      outline: none;
      font-size: 13px;
    }
    .edit-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.09); }
    .edit-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }
    .small-button {
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 750;
    }
    .small-button.save { color: #fff; background: var(--accent); }
    .small-button:hover { filter: brightness(.97); }
    .edit-error {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 650;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 144px;
      padding: 24px 12px;
      text-align: center;
      border: 1px dashed #dfe4ee;
      border-radius: 14px;
      color: #98a1b5;
      background: rgba(249,250,253,.7);
    }
    .empty-symbol { margin-bottom: 7px; font-size: 27px; opacity: .72; }
    .empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }

    .app-footer {
      padding: 23px 4px 0;
      color: #9aa3b6;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      max-width: min(420px, calc(100vw - 32px));
      padding: 11px 15px;
      color: #fff;
      border-radius: 12px;
      background: #25304a;
      box-shadow: 0 14px 35px rgba(24,32,53,.22);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: #b93e4c; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.86); opacity: .72; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    @media (max-width: 880px) {
      .hero { align-items: flex-start; flex-direction: column; }
      .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 99px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 750;
      transition: color .16s ease, background .16s ease;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aab3c6;
    }
    .sync-badge[data-status="connecting"] .sync-dot,
    .sync-badge[data-status="saving"] .sync-dot {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .sync-badge[data-status="synced"] { color: #347b60; background: var(--success-soft); }
    .sync-badge[data-status="synced"] .sync-dot { background: var(--success); }
    .sync-badge[data-status="offline"] { color: #a25d16; background: #fff6e7; }
    .sync-badge[data-status="offline"] .sync-dot { background: #dc8a2e; }
    .sync-button { white-space: nowrap; }
    .date-nav { justify-content: flex-start; max-width: none; }
      .add-form { grid-template-columns: minmax(0, 1fr) 125px 125px; }
      .add-form .primary-button { grid-column: 1 / -1; }
      .lists-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .app-shell { width: min(100% - 20px, 1080px); padding-top: 14px; }
      .hero { padding: 22px 20px; border-radius: 20px; }
      .clock { font-size: clamp(36px, 13vw, 52px); }
      .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 99px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 750;
      transition: color .16s ease, background .16s ease;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aab3c6;
    }
    .sync-badge[data-status="connecting"] .sync-dot,
    .sync-badge[data-status="saving"] .sync-dot {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .sync-badge[data-status="synced"] { color: #347b60; background: var(--success-soft); }
    .sync-badge[data-status="synced"] .sync-dot { background: var(--success); }
    .sync-badge[data-status="offline"] { color: #a25d16; background: #fff6e7; }
    .sync-badge[data-status="offline"] .sync-dot { background: #dc8a2e; }
    .sync-button { white-space: nowrap; }
    .date-nav { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; width: 100%; }
      .date-input { width: 100%; }
      .secondary-button { grid-column: 1 / -1; }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  <script>

      function isValidClockTime(value) {

      function normalizeStoredTask(item, index) {

          endTime = null;
        }

          text: item.text.trim().slice(0, MAX_TEXT_LENGTH),
          startTime,

        };
        const status = state.syncStatus || "connecting";
        elements.syncBadge.dataset.status = status;
        elements.syncText.textContent = labels[status] || labels.connecting;

      }

      function delay(milliseconds) {

      }

            if (response.ok) return response;
            const error = new Error(`HTTP ${response.status}`);
            if (response.status !== 429 && response.status < 500) throw error;
            lastError = error;
          } catch (error) {
            lastError = error;

      }
      async function requestRemoteData() {

          method: "GET",

        return normalizeSharedData(await response.json());

      function applyRemoteData(remoteData) {
        const remote = normalizeSharedData(remoteData);
        for (const dateString of state.pendingVersions.keys()) {

        state.sharedData = remote;
        bindSelectedTasks();
        cacheSharedData();
        renderAll();
      }

      async function syncFromRemote(options = {}) {
        if (saveInFlight) {
          saveQueued = true;
          return false;

        setSyncStatus("connecting");
        try {
          const remote = await requestRemoteData();
          applyRemoteData(remote);

          setSyncStatus("synced");

          return true;

        scheduleRemoteSave();

        if (!state.pendingVersions.size) {
          setSyncStatus("synced");
          return true;

          return false;

        saveQueued = false;

          }

            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(merged),

          const saved = normalizeSharedData(await response.json());

            if (state.pendingVersions.get(dateString) === version) {

          cacheSharedData();

          setSyncStatus("synced");

        actions.append(cancel, save);
        form.append(textInput, startInput, endInput, error, actions);

        cancel.addEventListener("click", () => {
          state.editingId = null;
          renderLists();
        });

        form.addEventListener("keydown", event => {
          if (event.key === "Escape") {
            event.preventDefault();
            state.editingId = null;
            renderLists();
          }
        });

        form.addEventListener("submit", event => {
          event.preventDefault();
          const result = validateTaskInput(textInput.value, startInput.value, endInput.value);
          if (result.error) {
            error.textContent = result.error;
            error.hidden = false;
            (result.normalizedText ? (!!startInput.value !== !!endInput.value ? startInput : endInput) : textInput).focus();
            return;
          }
          task.text = result.normalizedText;
          task.startTime = result.normalizedStart;
          task.endTime = result.normalizedEnd;
          state.editingId = null;
          persistTasks();
          renderAll();
          showToast("计划已更新");
        });

        return form;
      }

      function reorderGroup(done, draggedId, targetId) {
        if (draggedId === targetId) return;
        const group = getVisibleTasks(done);
        const fromIndex = group.findIndex(task => task.id === draggedId);
        const targetIndex = group.findIndex(task => task.id === targetId);
        if (fromIndex < 0 || targetIndex < 0) return;

        const [moved] = group.splice(fromIndex, 1);
        group.splice(targetIndex, 0, moved);
        const otherGroup = getVisibleTasks(!done);
        [...group, ...otherGroup].forEach((task, index) => {
          task.sort = index + 1;
        });
        persistTasks();
        renderAll();
      }

      function moveTask(taskId, direction) {
        const task = state.tasks.find(item => item.id === taskId);
        if (!task) return;
        const group = getVisibleTasks(task.done);
        const currentIndex = group.findIndex(item => item.id === taskId);
        const targetIndex = currentIndex + direction;
        if (targetIndex < 0 || targetIndex >= group.length) return;
        reorderGroup(task.done, taskId, group[targetIndex].id);
      }

      function toggleTask(taskId, done) {
        const task = state.tasks.find(item => item.id === taskId);
        if (!task) return;
        task.done = done;
        persistTasks();
        renderAll();
        showToast(done ? "这项计划已完成" : "已恢复到未完成");
      }

      function deleteTask(taskId) {
        const task = state.tasks.find(item => item.id === taskId);
        if (!task) return;
        if (!window.confirm(`确定删除“${task.text}”吗？`)) return;
        state.tasks = state.tasks.filter(item => item.id !== taskId);
        persistTasks();
        renderAll();
        showToast("计划已删除");
      }

      function createTaskElement(task) {
        const item = document.createElement("article");
        item.className = `task-item${task.done ? " is-done" : ""}`;
        item.dataset.id = task.id;
        item.setAttribute("role", "listitem");
        item.draggable = state.editingId !== task.id;

        const dragHandle = document.createElement("span");
        dragHandle.className = "drag-handle";
        dragHandle.textContent = "⠿";
        dragHandle.title = "拖动排序";
        dragHandle.setAttribute("aria-hidden", "true");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", task.done ? `取消完成：${task.text}` : `标记完成：${task.text}`);
        checkbox.addEventListener("change", () => toggleTask(task.id, checkbox.checked));

        if (state.editingId === task.id) {
          item.append(dragHandle, checkbox, createEditForm(task));
          return item;
        }

        const copy = document.createElement("div");
        copy.className = "task-copy";
        const text = document.createElement("p");
        text.className = "task-text";
        text.textContent = task.text;
        const meta = document.createElement("div");
        meta.className = "task-meta";
        const time = document.createElement("span");
        time.className = "time-pill";
        time.textContent = task.startTime && task.endTime
          ? `${task.startTime}–${task.endTime}`
          : "全天";
        meta.append(time);
        copy.append(text, meta);

        const actions = document.createElement("div");
        actions.className = "task-actions";
        actions.append(
          createActionButton("↑", "上移", "move-button", () => moveTask(task.id, -1)),
          createActionButton("↓", "下移", "move-button", () => moveTask(task.id, 1)),
          createActionButton("✎", "编辑计划", "action-button", () => startInlineEdit(task.id)),
          createActionButton("×", "删除计划", "action-button delete", () => deleteTask(task.id))
        );

        item.append(dragHandle, checkbox, copy, actions);

        item.addEventListener("dragstart", event => {
          state.draggedId = task.id;
          item.classList.add("is-dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", task.id);
        });
        item.addEventListener("dragend", () => {
          state.draggedId = null;
          item.classList.remove("is-dragging");
          document.querySelectorAll(".task-item.is-drag-over").forEach(node => node.classList.remove("is-drag-over"));
        });
        item.addEventListener("dragover", event => {
          const draggedTask = state.tasks.find(candidate => candidate.id === state.draggedId);
          if (!draggedTask || draggedTask.done !== task.done || draggedTask.id === task.id) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          item.classList.add("is-drag-over");
        });
        item.addEventListener("dragleave", event => {
          if (!item.contains(event.relatedTarget)) item.classList.remove("is-drag-over");
        });
        item.addEventListener("drop", event => {
          event.preventDefault();
          item.classList.remove("is-drag-over");
          if (state.draggedId && state.draggedId !== task.id) {
            reorderGroup(task.done, state.draggedId, task.id);
          }
          state.draggedId = null;
        });

        return item;
      }

      function renderLists() {
        const pendingTasks = getVisibleTasks(false);
        const doneTasks = getVisibleTasks(true);

        elements.pendingBadge.textContent = String(pendingTasks.length);
        elements.doneBadge.textContent = String(doneTasks.length);
        elements.pendingList.replaceChildren();
        elements.doneList.replaceChildren();

        if (pendingTasks.length) {
          pendingTasks.forEach(task => elements.pendingList.append(createTaskElement(task)));
        } else {
          elements.pendingList.append(createEmptyState(false));
        }

        if (doneTasks.length) {
          doneTasks.forEach(task => elements.doneList.append(createTaskElement(task)));
        } else {
          elements.doneList.append(createEmptyState(true));
        }
      }

      function renderAll() {
        renderDateControls();
        renderSyncStatus();
        renderStats();
        renderLists();
      }

      function selectDate(dateString) {
        if (!isDateString(dateString)) return;
        state.selectedDate = dateString;
        state.editingId = null;
        state.draggedId = null;
        bindSelectedTasks();
        clearFormError();
        renderAll();
      }

      elements.addForm.addEventListener("submit", event => {
        event.preventDefault();
        const result = validateTaskInput(elements.taskInput.value, elements.startInput.value, elements.endInput.value);
        if (result.error) {
          showFormError(result.error, result.normalizedText ? (elements.startInput.value ? elements.endInput : elements.startInput) : elements.taskInput);
          return;
        }

        const nextSort = state.tasks.reduce((maximum, task) => Math.max(maximum, task.sort), 0) + 1;
        state.tasks.push({
          id: createId(),
          text: result.normalizedText,
          startTime: result.normalizedStart,
          endTime: result.normalizedEnd,
          done: false,
          sort: nextSort
        });
        persistTasks();
        elements.addForm.reset();
        clearFormError();
        renderAll();
        elements.taskInput.focus();
        showToast("计划已添加");
      });

      [elements.taskInput, elements.startInput, elements.endInput].forEach(input => {
        input.addEventListener("input", clearFormError);
      });

      elements.datePicker.addEventListener("change", () => {
        const fallback = getBeijingNow().date;
        selectDate(elements.datePicker.value || fallback);
      });
      elements.prevDay.addEventListener("click", () => selectDate(shiftDate(state.selectedDate, -1)));
      elements.nextDay.addEventListener("click", () => selectDate(shiftDate(state.selectedDate, 1)));
      elements.todayButton.addEventListener("click", () => selectDate(getBeijingNow().date));

      const initialBeijingNow = getBeijingNow();
      lastBeijingDate = initialBeijingNow.date;
      state.sharedData = loadCachedSharedData();
      selectDate(initialBeijingNow.date);
      updateClock();
      renderAll();
      syncFromRemote();
      window.setInterval(updateClock, 1000);

      elements.syncButton.addEventListener("click", () => {
        if (state.pendingVersions.size) {
          savePendingChanges().then(success => {
            if (success) showToast("修改已同步到共享数据");
          });
        } else {
          syncFromRemote({ notify: true });
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          updateClock();
          syncFromRemote();
        }
      });
      window.addEventListener("focus", () => {
        if (!document.hidden) syncFromRemote();
      });
      window.addEventListener("online", () => {
        if (state.pendingVersions.size) savePendingChanges();
        else syncFromRemote();
      });    })();
  </script>
</body>
</html>
